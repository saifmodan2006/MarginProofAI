services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      APP_MODE: demo
      DATABASE_URL: sqlite:////data/marginproof.db
    volumes:
      - marginproof_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  marginproof_data:
